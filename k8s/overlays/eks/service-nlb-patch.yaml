# NLB INTERNO criado pelo AWS Load Balancer Controller, com os pods como alvos por IP.
# Nomes e valores das anotacoes conferidos na doc do controller (aberta em 14/10/2026):
# https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/
apiVersion: v1
kind: Service
metadata:
  name: simple-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: traffic-port
    # Cross-zone ligado (no NLB vem desligado): sem ele, quando o pod troca de AZ, o no do NLB da AZ antiga fica sem
    # alvo e as conexoes que chegam por ele travam. Medido na janela 3: falhas por ~100 s a cada rolling restart
    # (alvo antigo draining em us-east-1a, novo em us-east-1b). Custo: transferencia entre AZs, US$ 0,01/GB.
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    # Taxonomia de tags da AWS (Project > Track > Component) no NLB, no target group e no SG que o controller cria:
    # sem isso, o NLB do lab nao aparecia no filtro de custo por Project.
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Project=simple-api,Env=dev,Track=eks,Component=load-balancer,ManagedBy=aws-load-balancer-controller
spec:
  type: LoadBalancer
