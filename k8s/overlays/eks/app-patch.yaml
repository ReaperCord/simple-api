apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-api
spec:
  template:
    spec:
      # O NLB leva mais de 1 minuto para parar de mandar conexoes a um alvo desregistrado: na janela 3 as falhas
      # (timeout) seguiram por ~65 s depois de o pod antigo sumir, com o preStop de 8 s da base (calibrado no kind).
      # 90 s de preStop cobrem isso com folga; o grace period cobre preStop + encerramento da app (ate 8 s).
      terminationGracePeriodSeconds: 120
      containers:
        - name: simple-api
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "90"]
          # DB_HOST, DB_PORT, DB_DATABASE e DB_USER vem do ConfigMap `simple-api-db` (criado pelo workflow).
          envFrom:
            - configMapRef:
                name: simple-api-db
                optional: false
          env:
            # Autenticacao IAM do RDS (ADR 0013): o usuario do banco so tem CONNECT; as credenciais AWS do pod vem do
            # Pod Identity (nenhum segredo). verify-full e obrigatorio no modo IAM.
            - name: DB_AUTH_MODE
              value: iam
            - name: DB_SSLMODE
              value: verify-full
            - name: AWS_REGION
              value: us-east-1
