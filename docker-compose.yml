# Ambiente LOCAL (Postgres 16 com SCRAM + API). Nao e usado na AWS.
# Uso: cp application/.env.example application/.env  (trocar DB_PASSWORD)
#      docker compose --env-file application/.env up --build
# Portas publicadas somente em 127.0.0.1. A API nao tem autenticacao (contrato do desafio);
# a protecao real na AWS e o API Gateway.
services:
  db:
    # postgres:16-alpine fixado por digest (indice multi-arch, obtido em 2026-10-12)
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:?defina DB_DATABASE}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  api:
    build: ./application
    # required: false deixa `docker compose config` rodar sem o .env (CI/validacao estatica com .env.example).
    # Em uso real o db falha sem DB_USER/DB_PASSWORD/DB_DATABASE (${...:?}), entao a ausencia do .env nao passa em silencio.
    env_file:
      - path: ./application/.env
        required: false
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    cpus: 0.5
    mem_limit: 1g
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
